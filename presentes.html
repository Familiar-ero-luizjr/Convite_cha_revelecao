<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="description" content="Sugestões de presentes para o Chá Revelação de Luiza ou Enrique."/>
<meta name="theme-color" content="#f7e8de"/>
<meta property="og:type" content="website"/>

<meta property="og:title" content="Chá Revelação — Luiza ou Enrique"/>
<meta property="og:description" content="Venha descobrir com a gente quem está chegando!"/>
<meta property="og:image" content="https://familiar-ero-luizjr.github.io/Convite_cha_revelecao/og.png"/>
<meta property="og:url" content="https://familiar-ero-luizjr.github.io/Convite_cha_revelecao/"/>

<title>Sugestões de presentes — Chá Revelação</title>
<style>
:root{
  --text:#704f3e;
  --muted:#a47258;
  --accent:#b96f4b;
  --panel:rgba(255,250,244,.94);
  --panel-border:rgba(180,128,91,.55);
  --card:rgba(249,240,231,.94);
  --card-border:#d8b69b;
  --shadow:0 28px 70px rgba(80,50,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--text);background:#d8edf8;font-family:Arial,Helvetica,sans-serif}
a,button{font:inherit}
img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}

/* cenário Dia / Noite */
.background{
  position:absolute;inset:0;z-index:-3;
  background-position:center top;
  background-repeat:no-repeat;
  background-size:cover;
  transition:opacity .35s ease;
}
.bg-day{background-image:url("assets/fundo_dia.webp");opacity:1}
.bg-night{background-image:url("assets/fundo_noite.webp");opacity:0}
html[data-theme="night"] .bg-day{opacity:0}
html[data-theme="night"] .bg-night{opacity:1}

.atmosphere{
  position:absolute;inset:0;z-index:-2;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 48%,rgba(255,245,234,.12));
  pointer-events:none;
}
html[data-theme="night"] .atmosphere{
  background:linear-gradient(180deg,rgba(8,12,18,.16),rgba(8,12,18,.02) 48%,rgba(24,18,24,.10));
}

/* navegação */
.topbar{
  width:min(1120px,94vw);
  margin:0 auto;
  padding:20px 0 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  position:relative;
  z-index:20;
}
.back,.theme-switch{
  min-height:44px;
  border:1px solid rgba(112,79,62,.2);
  border-radius:999px;
  background:rgba(255,250,244,.90);
  color:var(--text);
  padding:10px 16px;
  text-decoration:none;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(70,45,30,.13);
  backdrop-filter:blur(8px);
}
.back:focus-visible,.theme-switch:focus-visible,.return-link:focus-visible{
  outline:4px solid rgba(229,176,144,.34);
  outline-offset:3px;
}

/* composição */
.shell{
  width:min(1120px,94vw);
  margin:0 auto;
  padding:32px 0 120px;
}

/* o topo invade o painel */
.hero{
  width:min(650px,65vw);
  margin:0 auto -105px;
  position:relative;
  z-index:7;
}
.hero img{width:100%}

/* painel principal */
.panel{
  width:min(850px,84vw);
  margin:0 auto;
  padding:145px 50px 60px;
  position:relative;
  z-index:4;
  border:2px solid var(--panel-border);
  border-radius:46px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(6px);
}
html[data-theme="night"] .panel{background:rgba(255,248,240,.94)}

.heading{text-align:center;margin-bottom:32px}
.eyebrow{
  margin:0 0 7px;
  color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(20px,2vw,28px);
}
.title{
  margin:0;
  color:var(--accent);
  font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
  font-size:clamp(62px,6.6vw,94px);
  font-weight:400;
  line-height:.95;
}
.subtitle{
  max-width:590px;
  margin:18px auto 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(18px,1.9vw,26px);
  line-height:1.4;
}

/* cards de presentes */
.gifts{
  width:min(680px,100%);
  margin:0 auto;
  display:grid;
  gap:18px;
}
.gift-card{
  display:grid;
  grid-template-columns:112px 1fr;
  gap:20px;
  align-items:center;
  min-height:128px;
  padding:10px 25px 10px 12px;
  border:2px solid var(--card-border);
  border-radius:34px;
  background:var(--card);
}
.gift-icon{
  width:104px;
  height:104px;
  border-radius:50%;
  overflow:hidden;
  background:#f4e9dd;
}
.gift-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.gift-copy{min-width:0}
.gift-copy strong{
  display:block;
  color:#ad7455;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(26px,2.7vw,38px);
  font-weight:400;
  line-height:1.08;
}
.gift-copy span{
  display:block;
  margin-top:5px;
  font-size:clamp(15px,1.5vw,19px);
  line-height:1.3;
}

/* elementos invadindo a lateral do painel */
.decor{
  position:absolute;
  z-index:6;
  pointer-events:none;
}
.pacifier{
  left:-92px;
  top:46%;
  width:145px;
}
.side-bear{
  right:-72px;
  top:44%;
  width:145px;
}

/* voltar */
.footer-action{text-align:center;margin-top:32px}
.return-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:0 24px;
  border-radius:999px;
  background:#a66c4d;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

/* rodapé decorativo, fora do painel */
.bottom-overlap{
  width:min(820px,86vw);
  height:270px;
  margin:-32px auto 0;
  position:relative;
  z-index:6;
  pointer-events:none;
}
.bottom-girl,.bottom-pram,.bottom-gift{
  position:absolute;
  bottom:-10px;
}
.bottom-girl{
  left:0;
  width:24%;
  max-width:205px;
}
.bottom-pram{
  left:50%;
  bottom:-62px;
  width:42%;
  max-width:360px;
  transform:translateX(-50%);
}
.bottom-gift{
  right:0;
  width:25%;
  max-width:215px;
}

/* Desktop mais enxuto, preservando a mesma hierarquia visual. */
@media(min-width:901px){
  .shell{width:min(900px,94vw);padding:26px 0 82px}
  .hero{width:520px;margin-bottom:-82px}
  .panel{width:760px;padding:112px 42px 48px;border-radius:40px}
  .heading{margin-bottom:25px}
  .title{font-size:72px}
  .subtitle{font-size:21px}
  .bottom-overlap{height:220px}
}

/* tablet */
@media(max-width:900px){
  .hero{width:73vw;margin-bottom:-82px}
  .panel{width:90vw;padding:120px 30px 52px}
  .pacifier{left:-58px;width:120px}
  .side-bear{right:-44px;width:120px}
}

/* mobile */
@media(max-width:600px){
  .background{
    background-position:center top;
    background-size:auto 100%;
  }
  .topbar{width:94vw;padding-top:12px}
  .back,.theme-switch{padding:8px 12px}
  .shell{width:100%;padding:28px 0 65px}
  .hero{
    width:89vw;
    max-width:510px;
    margin-bottom:-52px;
  }
  .panel{
    width:94vw;
    padding:82px 13px 38px;
    border-radius:30px;
  }
  .title{font-size:clamp(54px,15vw,78px)}
  .gifts{gap:14px}
  .gift-card{
    grid-template-columns:84px 1fr;
    gap:12px;
    min-height:104px;
    padding:9px 13px 9px 9px;
    border-radius:26px;
  }
  .gift-icon{width:78px;height:78px}
  .gift-copy strong{font-size:clamp(22px,6vw,30px)}
  .gift-copy span{font-size:14px}
  .pacifier{left:-35px;top:48%;width:84px}
  .side-bear{right:-24px;top:46%;width:84px}
  .bottom-overlap{
    width:96vw;
    height:180px;
    margin-top:-12px;
  }
  .bottom-girl{width:30%}
  .bottom-pram{width:52%;bottom:-38px}
  .bottom-gift{width:31%}
}
</style>

</head>

<div aria-hidden="true" class="atmosphere"></div>

<div aria-hidden="true" class="bottom-overlap">

</div>
</div>
</main>
<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById("themeSwitch");

  button.addEventListener("click", () => {
    const isNight = root.getAttribute("data-theme") === "night";
    root.setAttribute("data-theme", isNight ? "day" : "night");
    button.setAttribute("aria-pressed", String(!isNight));
    button.textContent = isNight ? "🌙 Modo noite" : "☀️ Modo dia";
  });
})();
</script>
<button aria-label="Ativar modo edição" aria-pressed="false" class="edit-toggle" id="editToggle" type="button">✏️ Editar</button>

</script>
