<!DOCTYPE html>

<html data-theme="day" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Chá Revelação — Convite</title>
<style>
:root{
  --text:#684d40;
  --gold:#c99464;
  --gold-soft:#b58261;
  --panel:rgba(255,250,244,.92);
  --panel-border:rgba(180,128,91,.55);
  --shadow:0 28px 70px rgba(80,50,30,.18);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:#d8edf8;
}

img{
  display:block;
  max-width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}

/* FUNDO DIA / NOITE */
.background{
  position:absolute;
  inset:0;
  z-index:-3;
  background-position:center top;
  background-repeat:no-repeat;
  background-size:cover;
  transition:opacity .35s ease;
}

.bg-day{
  background-image:url("assets_p1/fundo_dia.jfif");
  opacity:1;
}

.bg-night{
  background-image:url("assets_p1/fundo_noite.jfif");
  opacity:0;
}

html[data-theme="night"] .bg-day{opacity:0}
html[data-theme="night"] .bg-night{opacity:1}

.atmosphere{
  position:absolute;
  inset:0;
  z-index:-2;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 45%,rgba(255,245,234,.12));
  pointer-events:none;
}

html[data-theme="night"] .atmosphere{
  background:linear-gradient(180deg,rgba(8,12,18,.16),rgba(8,12,18,.02) 48%,rgba(24,18,24,.10));
}

/* BOTÃO TEMA */
.theme-switch{
  position:absolute;
  top:22px;
  right:22px;
  z-index:20;
  border:1px solid rgba(104,77,64,.2);
  background:rgba(255,250,244,.88);
  color:var(--text);
  border-radius:999px;
  padding:10px 16px;
  min-height:44px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(70,45,30,.13);
  backdrop-filter:blur(8px);
}

.theme-switch:focus-visible{
  outline:4px solid rgba(202,148,100,.28);
  outline-offset:3px;
}

/* COMPOSIÇÃO */
.shell{
  width:min(1120px,94vw);
  margin:0 auto;
  padding:54px 0 140px;
  position:relative;
}

/* TOPO: ursinhos + laterais, sobrepostos ao painel */
.hero{
  width:min(700px,66vw);
  margin:0 auto -112px;
  position:relative;
  z-index:7;
}

.hero-main{
  width:100%;
  position:relative;
  z-index:4;
}

.hero-left,
.hero-right{
  position:absolute;
  z-index:3;
  bottom:-8px;
  width:24%;
}

.hero-left{left:-24%}
.hero-right{right:-24%}

/* PAINEL CENTRAL */
.panel{
  width:min(860px,82vw);
  margin:0 auto;
  padding:150px 50px 64px;
  position:relative;
  z-index:4;
  text-align:center;
  border:2px solid var(--panel-border);
  border-radius:46px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(5px);
}

html[data-theme="night"] .panel{
  background:rgba(255,248,240,.93);
}

.cha-revelacao{
  margin:0 0 12px;
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,3.8vw,54px);
  font-weight:400;
  line-height:1.1;
}

.boy-girl{
  margin:0;
  color:var(--gold);
  font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
  font-size:clamp(82px,8.8vw,138px);
  font-weight:400;
  line-height:.92;
  white-space:nowrap;
}

.boy-girl .ou{
  display:inline-block;
  margin:0 .11em;
  color:var(--gold-soft);
  font-size:.4em;
  vertical-align:middle;
}

.invite-text{
  margin:42px 0 36px;
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(27px,2.7vw,40px);
  line-height:1.3;
  font-weight:400;
}

/* ENVELOPE */
.envelope-wrap{
  width:min(650px,88%);
  margin:0 auto;
  position:relative;
}

.envelope{
  width:100%;
}

.heart{
  position:absolute;
  left:50%;
  top:48%;
  width:30%;
  transform:translate(-50%,-50%);
  cursor:pointer;
  transition:transform .18s ease;
}

.heart:hover{
  transform:translate(-50%,-50%) scale(1.04);
}

.heart:focus-visible{
  outline:4px solid rgba(202,148,100,.25);
  outline-offset:4px;
}

/* DECORAÇÕES INFERIORES */
.panel-decor{
  position:relative;
  min-height:150px;
  margin-top:18px;
}

.baby-blocks{
  position:absolute;
  left:-20px;
  bottom:0;
  width:92px;
}

.rainbow{
  position:absolute;
  right:-62px;
  bottom:-12px;
  width:220px;
}

.scenery-space{
  height:270px;
}

/* TABLET */
@media(max-width:900px){
  .shell{
    width:96vw;
  }

  .hero{
    width:74vw;
    margin-bottom:-90px;
  }

  .hero-left,
  .hero-right{
    width:26%;
  }

  .hero-left{left:-18%}
  .hero-right{right:-18%}

  .panel{
    width:90vw;
    padding:125px 34px 54px;
  }

  .scenery-space{
    height:220px;
  }
}

/* MOBILE */
@media(max-width:600px){
  .background{
    background-position:center top;
    background-size:auto 100%;
  }

  .theme-switch{
    top:12px;
    right:12px;
    padding:8px 12px;
    min-height:42px;
  }

  .shell{
    width:100%;
    padding:50px 0 72px;
  }

  .hero{
    width:90vw;
    max-width:520px;
    margin-bottom:-58px;
  }

  .hero-left,
  .hero-right{
    width:27%;
    bottom:-2px;
  }

  .hero-left{left:-7%}
  .hero-right{right:-7%}

  .panel{
    width:94vw;
    padding:88px 16px 40px;
    border-radius:30px;
  }

  .cha-revelacao{
    font-size:clamp(27px,7.5vw,36px);
  }

  .boy-girl{
    font-size:clamp(60px,17vw,88px);
  }

  .invite-text{
    margin-top:32px;
    font-size:clamp(22px,6.5vw,31px);
  }

  .envelope-wrap{
    width:94%;
  }

  .baby-blocks{
    left:-4px;
    width:72px;
  }

  .rainbow{
    right:-50px;
    width:180px;
  }

  .scenery-space{
    height:160px;
  }
}
</style>
<link href="editor.css" rel="stylesheet"/>
<!-- Firebase/Firestore reaproveitados da V1 -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/config/app-config.js"></script>
<script src="js/config/convite-data.js"></script>
<script src="js/services/data-service.js"></script>
<script src="js/services/admin-api.js"></script>
<script src="js/services/present-images-service.js"></script>
<script src="js/adapters/firebase-adapter.js"></script>
<script src="js/site-data.js"></script>
<script src="js/admin-auth.js"></script>
</head>
<body data-editor-page="pagina1">
<main class="page">
<div aria-hidden="true" class="background bg-day" data-bg-key="imagens.pagina1.fundoDia"></div>
<div aria-hidden="true" class="background bg-night" data-bg-key="imagens.pagina1.fundoNoite"></div>
<div aria-hidden="true" class="atmosphere"></div>
<button aria-pressed="false" class="theme-switch" id="themeSwitch" type="button">
    🌙 Modo noite
  </button>
<div class="shell">
<!-- TOPO SOBREPOSTO AO PAINEL -->
<div class="hero">
<img alt="Dois ursinhos sobre nuvens" class="hero-main" data-image-key="imagens.pagina1.topo" src="assets_p1/01_ursinhos_na_nuvem.png"/>
<img alt="" class="hero-left" data-image-key="imagens.pagina1.baloesEsquerda" src="assets_p1/03_baloes_esquerda.png"/>
<img alt="" class="hero-right" data-image-key="imagens.pagina1.baloesDireita" src="assets_p1/04_baloes_direita.png"/>
</div>
<!-- PAINEL CENTRAL -->
<section aria-label="Convite do chá revelação" class="panel">
<p class="cha-revelacao" data-edit-key="titulo-cha">Chá Revelação</p>
<h1 class="boy-girl"><span data-edit-key="p1-boy">Boy</span> <span class="ou" data-edit-key="p1-ou">ou</span> <span data-edit-key="p1-girl">Girl</span></h1>
<p class="invite-text" data-edit-key="texto-convite">
        Você acaba de receber<br/>
        um convite especial!
      </p>
<!-- ENVELOPE PRINCIPAL -->
<div class="envelope-wrap">
<img alt="Envelope" class="envelope" data-image-key="imagens.pagina1.envelope" src="assets_p1/08_envelope_clique_aqui.png"/>
<a aria-label="Ir para a Página 2" href="pagina2.html">
<img alt="Clique aqui" class="heart" data-image-key="imagens.pagina1.cliqueAqui" src="assets_p1/08.1_clique_aqui.png" tabindex="0"/>
</a>
</div>
<!-- DETALHES DECORATIVOS -->
<div aria-hidden="true" class="panel-decor">
<img alt="" class="baby-blocks" data-image-key="imagens.pagina1.blocos" src="assets_p1/09_blocos_baby.png"/>
<img alt="" class="rainbow" data-image-key="imagens.pagina1.arcoIris" src="assets_p1/10_arco_iris_inferior.png"/>
</div>
</section>
<div aria-hidden="true" class="scenery-space"></div>
</div>
</main>
<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById("themeSwitch");

  button.addEventListener("click", () => {
    const isNight = root.getAttribute("data-theme") === "night";
    root.setAttribute("data-theme", isNight ? "day" : "night");
    button.setAttribute("aria-pressed", String(!isNight));
    button.textContent = isNight ? "🌙 Modo noite" : "☀️ Modo dia";
  });
})();
</script>
<button aria-label="Ativar modo edição" aria-pressed="false" class="edit-toggle" id="editToggle" type="button">✏️ Editar</button>
<script>
(async () => {
  await window.InviteApp.load();
})();
</script>
<script src="editor.js"></script>
</body>
</html>
