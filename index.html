<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Convite interativo para chá revelação" />
  <title>Convite Chá Revelação</title>
  <link rel="stylesheet" href="css/convite.css" />
  <link rel="stylesheet" href="css/convite-overlays.css" />
  <link rel="stylesheet" href="css/admin-entry.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="screen active" id="screen-0" aria-label="Capa do convite"><div class="art"><img src="assets/convite/page_1.jpeg" alt="" /></div><button class="hotspot open-letter" id="openLetter" aria-label="Abrir convite"></button><i class="pulse" aria-hidden="true"></i><span class="hint" id="openHint"></span></section>
    <section class="screen" id="screen-1" aria-label="Detalhes do convite"><div class="art"><img src="assets/convite/page_2.jpeg" alt="" /><div class="editable-names" aria-label="Possíveis nomes do bebê"><strong id="girlName"></strong><span id="orText"></span><strong id="boyName"></strong></div><strong class="event-data event-date" id="eventDate"></strong><strong class="event-data event-time" id="eventTime"></strong></div><button class="hotspot confirm" id="confirmBtn" aria-label="Confirmar presença"></button><button class="hotspot location" id="locationBtn" aria-label="Abrir localização da festa"></button><button class="hotspot gifts" id="giftsBtn" aria-label="Abrir sugestões de presentes"></button></section>
    <section class="screen" id="screen-2" aria-label="Sugestões de presentes"><div class="art"><img src="assets/convite/page_3.jpeg" alt="" /><div class="gift-editable-content" id="giftEditableContent" aria-label="Sugestões de presentes editáveis"></div></div><button class="hotspot open-list" id="listBtn" aria-label="Abrir lista de presentes"></button></section>
    <nav class="nav" aria-label="Navegação do convite"><button id="backBtn" type="button"></button></nav>
    <div class="progress" aria-hidden="true"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div>
  </main>
  <a class="admin-link" href="admin.html" aria-label="Abrir painel administrativo" title="Painel administrativo"><span aria-hidden="true">⚙</span><span class="admin-link-label">Administrar</span></a>
  <script src="js/config/app-config.js"></script>
  <script src="js/config/convite-data.js"></script>
  <script src="js/services/data-service.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
  <script src="js/adapters/firebase-adapter.js"></script>
  <script src="js/pages/convite.js"></script>
</body>
</html>
